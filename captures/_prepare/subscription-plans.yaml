# Two subscription plans on the product Horatio (id 1): "Abonnement mensuel" (monthly, 7 days of trial,
# commitment of 3 installments, pausable) and "Abonnement annuel" (yearly). Needs a core that carries the subscriptions (3.4).
# The subscriptions themselves cannot be taken through the back office: no payment module of the core charges
# a stored method without the customer. The list and detail shots read six rows inserted in the capture instance
# (tables subscription, subscription_order, subscription_history and customer_payment_method).
done:
  url: '/admin/products/update?product_id=1&current_tab=subscription-plans'
  waitFor: '[data-testid="subscription-plans-tab"]'
  selector: '[data-testid="subscription-plans-tab"] td:has-text("Abonnement annuel")'
steps:
  - url: '/admin/products/update?product_id=1&current_tab=subscription-plans&plan=new'
    actions:
      - waitFor: '[data-testid="subscription-plan-form"]'
      - fill: { selector: '[data-testid="subscription-plan-title-fr_FR"]', value: 'Abonnement mensuel' }
      - fill: { selector: '[data-testid="subscription-plan-title-en_US"]', value: 'Monthly subscription' }
      - fill: { selector: '[data-testid="subscription-plan-price-EUR"]', value: '12.50' }
      - select: { selector: '[data-testid="subscription-plan-period-unit"]', value: 'month' }
      - fill: { selector: '[data-testid="subscription-plan-trial-days"]', value: '7' }
      - fill: { selector: '[data-testid="subscription-plan-commitment-count"]', value: '3' }
      - check: '[data-testid="subscription-plan-pausable"]'
      - click: '[data-testid="subscription-plan-save"]'
      - waitFor: '[data-testid="subscription-plans-tab"] table'
  - url: '/admin/products/update?product_id=1&current_tab=subscription-plans&plan=new'
    actions:
      - waitFor: '[data-testid="subscription-plan-form"]'
      - fill: { selector: '[data-testid="subscription-plan-title-fr_FR"]', value: 'Abonnement annuel' }
      - fill: { selector: '[data-testid="subscription-plan-title-en_US"]', value: 'Yearly subscription' }
      - fill: { selector: '[data-testid="subscription-plan-price-EUR"]', value: '120' }
      - select: { selector: '[data-testid="subscription-plan-period-unit"]', value: 'year' }
      - click: '[data-testid="subscription-plan-save"]'
      - waitFor: '[data-testid="subscription-plans-tab"] table'

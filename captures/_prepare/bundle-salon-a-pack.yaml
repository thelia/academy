# A new product "Pack salon Nigel" (ref PACK-SALON-NIGEL), made a bundle priced by its components less 10 %.
# Created with the "Créer un nouveau produit" window, so it has the single combination a bundle needs.
# The title is saved in French, then in English (bug default-twig#171: creation uses the edit language of the session).
done:
  url: '/admin/products?q=PACK-SALON-NIGEL&bundle=1'
  selector: '[data-testid="bo-product-ref-link"]'
steps:
  # Opening any product sheet in French makes French the edit language of the session.
  - url: '/admin/products/update?product_id=1&edit_language_id=1'
  - url: '/admin/products'
    actions:
      - click: '[data-testid="product-create-button"]'
      - waitFor: '#product-create-modal.show [data-testid="product-create-submit"]'
      - fill: { selector: '#product-create-modal [name="thelia_product_creation[ref]"]', value: 'PACK-SALON-NIGEL' }
      - fill: { selector: '#product-create-modal [name="thelia_product_creation[title]"]', value: 'Pack salon Nigel' }
      - select: { selector: '#product-create-modal [name="thelia_product_creation[default_category]"]', value: '1' }
      - check: '#product-create-modal [name="thelia_product_creation[visible]"]'
      - fill: { selector: '#product-create-modal [name="thelia_product_creation[price]"]', value: '0' }
      - fill: { selector: '#product-create-modal [name="thelia_product_creation[quantity]"]', value: '0' }
      - click: '[data-testid="product-create-submit"]'
      - waitFor: '[data-testid="product-edit-form"]'
      - check: '[data-testid="product-edit-is-bundle"]'
      - select: { selector: '[data-testid="product-edit-bundle-price-mode"]', value: 'computed' }
      - fill: { selector: '[data-testid="product-edit-bundle-discount"]', value: '10' }
      - select: { selector: '[data-testid="product-edit-bundle-discount-type"]', value: 'percent' }
      - click: '[data-testid="product-edit-save-stay"]'
      - waitFor: '[data-testid="product-tab-bundle"]'
      - click: '[data-testid="bo-language-switcher-en"]'
      - waitForUrl: 'edit_language_id=2'
      - waitFor: '[data-testid="product-edit-form"]'
      - fill: { selector: '[name="thelia_product_modification[title]"]', value: 'Nigel living room set' }
      - click: '[data-testid="product-edit-save-stay"]'
      - waitFor: '[data-testid="product-edit-form"]'
vars:
  bundle_product_id:
    selector: '[data-testid="bo-product-ref-link"]'
    attribute: href
    pattern: 'product_id=(\d+)'
